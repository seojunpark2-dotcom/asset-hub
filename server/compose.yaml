services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BIND_ADDRESS: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ACCOUNT_DOMAIN: ${ACCOUNT_DOMAIN:?Set ACCOUNT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
